name: Build

permissions:
  contents: write
  id-token: write 

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Set version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          fi

      - name: Build
        run: dotnet build haveno-dotnet.sln -c Release -p:Version=$VERSION

      - name: Run tests
        run: dotnet test haveno-dotnet.sln -c Release --no-build --verbosity normal

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: |
            **/bin/Release/*.nupkg
            **/bin/Release/*.snupkg
          if-no-files-found: error

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            **/bin/Release/*.nupkg
            **/bin/Release/*.snupkg

      - name: NuGet login
        if: startsWith(github.ref, 'refs/tags/')
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: NuGet push
        if: startsWith(github.ref, 'refs/tags/')
        run: dotnet nuget push "**/bin/Release/*.nupkg" --api-key ${{steps.login.outputs.NUGET_API_KEY}} --source https://api.nuget.org/v3/index.json